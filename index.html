<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d10" />
    <meta
      name="description"
      content="SpammerAegis: local X archive forensics. Import a ZIP, live-check handles, find returning alts, export to Gephi."
    />
    <title>SpammerAegis · alpha</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.addEventListener("error", function (e) {
        var root = document.getElementById("app");
        if (!root || root.childElementCount) return;
        root.innerHTML =
          '<pre style="padding:16px;color:#c45c4a;white-space:pre-wrap">' +
          String((e.error && e.error.stack) || e.message) +
          "</pre>";
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
